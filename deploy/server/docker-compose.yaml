# Shiori API + Postgres — production bundle
#
# Server path (example): /opt/api.shiori.cloud
#   cp deploy/server/docker-compose.yaml docker-compose.yml   # or use -f path
#   cp .env.example .env   # set POSTGRES_PASSWORD, TELEGRAM_BOT_TOKEN, …
#   docker compose pull
#   docker compose up -d
#   curl -sf http://127.0.0.1:${APP_PORT:-4001}/api/v1/health
#
# DATABASE_URL is set here (host = service name "postgres") so .env cannot point at wrong DB.

services:
  postgres:
    image: postgres:16-alpine
    container_name: shiori-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiori}
      POSTGRES_DB: shiori
    volumes:
      - shiori_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiori -d shiori']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ghcr.io/shioricloud/api.shiori.cloud:latest
    container_name: api.shiori.cloud
    restart: unless-stopped
    ports:
      - '${APP_PORT:-4001}:${APP_PORT:-4001}'
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-4001}
      DATABASE_URL: postgresql://shiori:${POSTGRES_PASSWORD:-shiori}@postgres:5432/shiori
      MEDIA_STORAGE_PATH: /app/data/uploads
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://api.shiori.cloud}
    volumes:
      - shiori_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'

volumes:
  shiori_pgdata:
  shiori_uploads:
