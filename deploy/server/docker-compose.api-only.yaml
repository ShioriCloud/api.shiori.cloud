# API only — Postgres جدا (مثلاً shiori-postgres روی همان شبکه).
#
# cd /opt/api.shiori.cloud
# docker compose -f deploy/server/docker-compose.api-only.yaml pull
# docker compose -f deploy/server/docker-compose.api-only.yaml up -d --force-recreate
#
# .env حداقل:
#   POSTGRES_PASSWORD=...
#   DATABASE_URL=postgresql://shiori:${POSTGRES_PASSWORD}@shiori-postgres:5432/shiori
#   TELEGRAM_BOT_TOKEN=...
#   APP_ALLOW_ORIGINS=https://shiori.cloud,https://dash.shiori.cloud
#   DATABASE_SYNC=false

services:
  api:
    image: ghcr.io/shioricloud/api.shiori.cloud:latest
    container_name: api.shiori.cloud
    restart: unless-stopped
    ports:
      - '${APP_PORT:-4001}:${APP_PORT:-4001}'
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: ${APP_PORT:-4001}
      MEDIA_STORAGE_PATH: /app/data/uploads
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://api.shiori.cloud}
    volumes:
      - shiori_uploads:/app/data/uploads
    networks:
      - shiori-network
    labels:
      - 'com.centurylinklabs.watchtower.enable=true'

networks:
  shiori-network:
    external: true

volumes:
  shiori_uploads:
