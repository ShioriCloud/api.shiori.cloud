services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: shiori
      POSTGRES_PASSWORD: shiori
      POSTGRES_DB: shiori
    volumes:
      - shiori_pgdata:/var/lib/postgresql/data

volumes:
  shiori_pgdata:
