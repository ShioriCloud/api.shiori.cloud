# Production stack — API + optional local Postgres.
# For managed Postgres, remove the postgres service and set DATABASE_URL in .env.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiori}
      POSTGRES_DB: shiori
    volumes:
      - shiori_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shiori -d shiori']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-4001}:4001'
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 4001
      DATABASE_URL: ${DATABASE_URL:-postgresql://shiori:${POSTGRES_PASSWORD:-shiori}@postgres:5432/shiori}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shiori_pgdata:
